# AWS RDS MySQL
spring.datasource.url=jdbc:mysql://dhilip-pickles-db.cdes04wywt95.ap-southeast-2.rds.amazonaws.com:3306/dhilip_pickles
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8081

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Initial Admin Bootstrap
app.admin.bootstrap=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.full-name=${ADMIN_FULL_NAME:}
app.admin.mobile=${ADMIN_MOBILE:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
